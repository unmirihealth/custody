version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    ignore:
      # Python version bumps here aren't safe to automate: duckdb (the
      # only thing this image exists to carry) ships prebuilt wheels on
      # a lag behind new CPython releases, and this alpine base has no
      # C++ compiler to build one from source if a wheel isn't
      # available yet (confirmed: python:3.15-alpine -> `duckdb==1.1.3`
      # build fails on a missing /usr/bin/g++). Bump this by hand once
      # duckdb actually publishes a wheel for the target version.
      - dependency-name: "python"
